[build-system]
# The release build pins hatchling and its dependencies with hashes in
# .github/build-constraints.txt; regenerate that file when changing this pin.
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "fft-cnr"
version = "0.4.2"
description = "FFT-based contrast-to-noise ratio estimation from a single frame"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Joseph J. Thiebes" },
]
keywords = ["cnr", "fft", "signal-processing", "noise", "measurement"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.urls]
Homepage = "https://github.com/thiebes/fft-cnr"
Repository = "https://github.com/thiebes/fft-cnr"
Documentation = "https://fft-cnr.readthedocs.io"
Issues = "https://github.com/thiebes/fft-cnr/issues"
Changelog = "https://github.com/thiebes/fft-cnr/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
# The validation and docs extras and the validation dependency group are marked
# for Python 3.11.5+, and the assets group for 3.11+, so on older Pythons they
# install nothing. matplotlib pulls in Pillow, whose security fixes (13.0.0 and
# later) no longer support 3.10. jupyter and pydata-sphinx-theme pull in
# soupsieve, whose fixed releases need 3.11.5. The package itself still
# supports 3.10.
validation = [
    "jupyter>=1.0; python_full_version >= '3.11.5'",
    "matplotlib>=3.7; python_full_version >= '3.11.5'",
    "tqdm>=4.60; python_full_version >= '3.11.5'",
]
docs = [
    "sphinx>=8.0; python_full_version >= '3.11.5'",
    "pydata-sphinx-theme>=0.16; python_full_version >= '3.11.5'",
    "myst-parser>=4.0; python_full_version >= '3.11.5'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fft_cnr"]

[tool.hatch.build.targets.sdist]
# Anchored to the project root: unanchored patterns match at any depth and
# would pick up same-named files under locally ignored directories.
include = [
    "/src/fft_cnr",
    "/tests",
    "/docs",
    "/scripts",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CITATION.cff",
]
exclude = ["/docs/_build"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
# validation: Python 3.11.5+ only; assets: 3.11+ only. See
# [project.optional-dependencies].
validation = [
    "jupyter>=1.0; python_full_version >= '3.11.5'",
    "matplotlib>=3.7; python_full_version >= '3.11.5'",
    "tqdm>=4.60; python_full_version >= '3.11.5'",
]
assets = [
    "matplotlib>=3.7; python_version >= '3.11'",
    "curved-text>=0.5.0; python_version >= '3.11'",
]
